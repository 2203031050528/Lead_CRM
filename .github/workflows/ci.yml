name: CI

on:
  push:
    branches-ignore: [main]   # main is tested by deploy.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump   # runs the real-pg_dump backup test if present
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --settings=config.settings.test > /dev/null
      - name: Tests
        run: pytest -rs

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Static export
        run: |
          npm run build
          test -f out/index.html && test -f out/leads/detail.html && test -d out/_next/static

  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          bash -n deploy/setup_server.sh deploy/remote_deploy.sh
          shellcheck -S style deploy/setup_server.sh deploy/remote_deploy.sh
      - name: Nginx site
        run: |
          sed 's/CRM_DOMAIN/crm.example.com/g' deploy/nginx/crm.conf > /tmp/crm.conf
          printf 'events {}\nhttp {\n  include /etc/nginx/mime.types;\n  include /tmp/crm.conf;\n}\n' > /tmp/nginx.conf
          sudo nginx -t -c /tmp/nginx.conf
      - name: systemd units
        run: |
          sudo useradd --system crm || true
          sudo install -d /srv/crm/venv/bin /srv/crm/backend
          sudo ln -sf /bin/true /srv/crm/venv/bin/gunicorn
          systemd-analyze verify deploy/systemd/gunicorn.socket deploy/systemd/gunicorn.service
      - name: Cron file
        run: python3 deploy/checks/check_cron.py
