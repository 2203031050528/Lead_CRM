# Lead CRM - Nginx site. setup_server.sh installs it as /etc/nginx/sites-available/crm with
# CRM_DOMAIN replaced; certbot --nginx then adds the HTTPS server block and the HTTP→HTTPS redirect.

upstream crm_gunicorn {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name CRM_DOMAIN;

    root /srv/crm/frontend/out;          # the static Next.js export
    client_max_body_size 10M;            # CSV imports (attachments go straight to S3)
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Inherited by every location below, as long as no location uses add_header itself
    # (cache lifetimes use "expires" for that reason).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build assets never change: cache for a year.
    location /_next/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Django admin's CSS/JS (manage.py collectstatic → STATIC_ROOT).
    location /static/ {
        alias /srv/crm/static/;
        expires 30d;
        access_log off;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://crm_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;          # Gunicorn's own timeout (30s) fires first
    }

    # Pages: /leads → leads.html, / → index.html. HTML is revalidated so deploys show up at once.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
