# Lead CRM - PostgreSQL tuned for a 1 GB instance shared with Nginx + 2 Gunicorn workers.
# Installed as /etc/postgresql/16/main/conf.d/crm-low-memory.conf (Ubuntu includes conf.d/).
listen_addresses = 'localhost'
max_connections = 20                 # 2 workers + cron jobs + psql need far fewer
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 384MB
wal_buffers = 4MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1               # gp3 SSD
effective_io_concurrency = 200
huge_pages = off
